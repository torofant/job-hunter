services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: job_hunter
      POSTGRES_USER: job_hunter
      POSTGRES_PASSWORD: job_hunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_hunter -d job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
